<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080d22">
  <meta name="description" content="113班同学照片制作的合成小游戏">
  <title>113合成大朋友</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <div class="aurora one"></div><div class="aurora two"></div>
    <section class="game-layout">
      <div class="board-card">
        <div class="board-topline"><span>危险线以上静止 1.5 秒即结束</span><span class="live-dot">LIVE</span></div>
        <div class="canvas-wrap">
          <canvas id="game" aria-label="113合成大朋友游戏区域"></canvas>
          <div id="gameOver" class="game-over hidden">
            <span class="kicker">本局结束</span><strong id="finalScore">0</strong><span>最高分 <b id="finalBest">0</b></span>
            <div class="actions"><button data-open-rank>🏆 本机榜</button><button id="again">↻ 再来一局</button></div>
          </div>
        </div>
      </div>
      <aside class="control-panel">
        <header class="brand"><span class="eyebrow">CLASS 113 · FRIEND MERGE</span><h1>113合成大朋友</h1><p>相同人物碰到一起，就会升级成更大的朋友。</p></header>
        <div class="score-grid"><div><span>本局分数</span><strong id="score">0</strong></div><div><span>最高分</span><strong id="best">0</strong></div></div>
        <div class="preview-grid">
          <div class="next-card"><div><span>下一个</span><strong id="nextLabel"></strong></div><div id="nextAvatar" class="next-avatar"><img id="nextImage" alt=""></div></div>
          <div class="max-card"><div><span>当前最大</span><strong id="maxLabel">暂无</strong></div><div class="max-avatar"><img id="maxImage" alt=""></div></div>
        </div>
        <div class="merge-chain"><span>合成图鉴</span><div id="chain" class="chain-row"></div></div>
        <div class="button-grid"><button data-open-rank>🏆 排行榜</button><button id="mute">🔊 音效开</button><button id="restart">↻ 重开</button></div>
        <div class="instructions"><p><b>电脑</b> 移动鼠标瞄准，点击投放；← → 微调，空格投放。</p><p><b>手机</b> 按住拖动瞄准，松手投放。</p></div>
      </aside>
    </section>
  </main>
  <dialog id="rankDialog">
    <button id="closeRank" class="close" aria-label="关闭">×</button>
    <h2>🏅 本机高手榜</h2><p>成绩只保存在这台设备上，换设备不会同步。</p>
    <label>我的昵称 <input id="playerName" maxlength="12" value="默认用户"></label>
    <div id="rankList" class="rank-list"></div>
  </dialog>
  <script src="./game.js" defer></script>
</body>
</html>
